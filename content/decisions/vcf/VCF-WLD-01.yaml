id: VCF-WLD-01
area: vcf-domains
title: Workload placement model
appliesTo: ["9.0", "9.1"]
status: draft
question: Will tenant workloads run in the management domain or in dedicated VI workload domains?
options:
  - id: consolidated
    label: Consolidated (workloads in management domain)
    summary: Management and tenant workloads share the management domain clusters.
    justification: Smallest footprint for small environments.
    implications:
      - Resource contention between management appliances and workloads must be controlled.
      - Lifecycle of tenant capacity is tied to the management domain.
  - id: dedicated
    label: Dedicated VI workload domain(s)
    summary: Tenant workloads run in one or more separate VI workload domains.
    justification: Isolates management from consumption capacity and allows independent lifecycle and scale.
    implications:
      - Additional vCenter (and NSX, depending on design) per workload domain.
default: dedicated
links: [td-vcf9-design]
diagrams: [vcf-hierarchy]
