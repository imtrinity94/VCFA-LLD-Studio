id: VCFA-DEP-01
area: vcfa-deploy
title: VCF Automation deployment path
appliesTo: ["9.0", "9.1"]
status: draft
question: How will VCF Automation be deployed?
context: >
  VCF Automation can be deployed by the VCF Installer as part of a new VCF
  deployment, or afterwards from VCF Operations fleet management. Only the
  fleet management path allows custom network placement.
options:
  - id: installer
    label: VCF Installer (with the initial VCF deployment)
    statement: deploy VCF Automation using the VCF Installer.
    summary: Deployed together with the other management components on the default VM management port group.
    justification: No custom network configuration is needed; simplest and fastest path.
    implications:
      - VCF Automation lands on the default management network.
      - Moving it to another network later may require redeployment.
    recommendedWhen:
      - { all: [{ requirement: RQ-PATH, in: [greenfield] }, { requirement: RQ-NETSEG, in: [no] }] }
  - id: fleet-mgmt
    label: VCF Operations fleet management (after core deployment)
    statement: deploy VCF Automation from VCF Operations fleet management.
    summary: Deployed after the core management components, with custom networking if needed.
    justification: Needed when VCF Automation is added to an existing fleet or needs a dedicated network.
    implications:
      - Target network and IP addressing must be prepared before deployment.
    recommendedWhen:
      - { requirement: RQ-PATH, in: [existing] }
      - { requirement: RQ-NETSEG, in: [yes] }
default: installer
links: [kb-426100]
