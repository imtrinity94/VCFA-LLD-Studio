<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VCFA LLD Studio</title>
<meta name="description" content="Requirements-driven design selection for VMware Cloud Foundation and VCF Automation, exported as a design reference sheet.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f3a5f'/%3E%3Cpath d='M8 9h6v14H8zM18 9h6v6h-6zM18 17h6v6h-6z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo"></span><div><b>VCFA LLD Studio</b><small id="cat-version"></small></div></div>
  <nav class="tabs">
    <button class="tab" data-view="requirements">1 · Requirements</button>
    <button class="tab" data-view="design">2 · Design</button>
    <button class="tab" data-view="library">Library</button>
    <button class="tab" data-view="diagrams">Diagrams</button>
    <button class="tab" data-view="glossary">Glossary</button>
    <button class="tab" data-view="about">About</button>
  </nav>
  <div class="exports">
    <button data-act="xlsx" class="primary">Export reference sheet (.xlsx)</button>
  </div>
</header>

<section class="metabar">
  <label>Customer <input id="meta-customer" placeholder="local only, never committed"></label>
  <label title="Short code used in requirement IDs, e.g. VCF-AUTO-NET-CODE-001">Code <input id="meta-customerCode" size="8"></label>
  <label>LLD template
    <select id="meta-projectType"><option value="broadcom">Broadcom</option><option value="mbcom">MBCOM</option></select>
  </label>
  <label>VCF version
    <select id="meta-vcfVersion"><option>9.0</option><option>9.1</option></select>
  </label>
  <label>Architect <input id="meta-author" size="14"></label>
  <span id="progress" class="progress"></span>
  <span class="spacer"></span>
  <div class="menu">
    <button data-act="new" class="ghost">New customer</button>
    <button data-act="open-profile" class="ghost">Open profile</button>
    <button data-act="save-profile" class="ghost">Save profile</button>
  </div>
  <input type="file" id="file-profile" accept=".json" hidden>
</section>

<main id="main"></main>
<div id="toast" class="toast" role="status"></div>
<script src="dist/app.js"></script>
</body>
</html>
